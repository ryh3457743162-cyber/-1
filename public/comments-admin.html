<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>评论管理 · 凡凡 & 涵涵</title>
  <style>
    :root{--paper:#f6f1eb;--surface:#fffcf8;--wine:#965462;--wine-deep:#79424e;--line:#e6dcd4;--ink:#514843;--muted:#91857d}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif}body.modal-open{overflow:hidden}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}a{color:inherit;text-decoration:none}:is(button,input,select,a):focus-visible{outline:2px solid var(--wine);outline-offset:3px}.shell{width:min(1080px,calc(100% - 36px));margin:auto;padding:25px 0 75px}.surface{background:var(--surface);border:1px solid #5c4c4115;border-radius:18px;box-shadow:0 10px 32px #3b2f270b}.login{width:min(430px,100%);margin:12vh auto;padding:28px}.login h1,.brand h1{margin:0;font:400 30px Georgia,"Songti SC",serif}.muted{color:var(--muted);font-size:12px;line-height:1.6}.login input,.filters input,.filters select,.modal select{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}.login input{margin:13px 0}.primary,.quiet{min-height:38px;padding:8px 14px;border-radius:9px;font-size:12px}.primary{border:1px solid var(--wine);background:var(--wine);color:#fff}.primary:hover{background:var(--wine-deep)}.quiet{border:1px solid var(--line);background:white;color:var(--ink)}.quiet:hover{border-color:var(--wine);color:var(--wine)}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:22px}.brand p{margin:4px 0;color:var(--muted);font-size:11px;letter-spacing:.15em}.top-actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.top-actions a,.top-actions button{min-height:38px;padding:8px 12px;border:0;border-radius:999px;background:transparent;color:#706660;font-size:12px}.top-actions a[aria-current="page"]{background:#e9e3dc;color:#4d4140}.top-actions a:hover,.top-actions button:hover{background:#fff}.content{padding:clamp(18px,3vw,28px)}.heading{display:flex;justify-content:space-between;align-items:baseline;gap:15px}.heading h2{margin:0;font:400 24px Georgia,"Songti SC",serif}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin:20px 0}.comment-list{display:grid;gap:11px}.comment-row{display:grid;grid-template-columns:82px 1fr;gap:15px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fffdfa}.thumb{width:82px;height:94px;object-fit:cover;border-radius:8px;background:#eee4da}.comment-main{min-width:0}.comment-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.comment-meta strong{color:var(--wine);font-size:13px}.comment-meta time,.comment-photo{color:var(--muted);font-size:11px}.badge{padding:3px 7px;border-radius:99px;background:#ece6e0;color:#8a6268;font-size:10px}.comment-text{margin:9px 0;line-height:1.7;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.row-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.row-actions button{min-height:31px;padding:5px 9px}.paging{display:flex;justify-content:center;align-items:center;gap:13px;margin-top:20px;color:var(--muted);font-size:12px}.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:#2d23239c}.modal-card{width:min(430px,100%);max-height:90dvh;overflow:auto;padding:25px;border-radius:17px;background:#fffcf8;box-shadow:0 24px 60px #241c1b2d}.modal-card h2{margin:0 0 9px;font:400 23px Georgia,"Songti SC",serif}.modal-card p{color:#716962;font-size:13px;line-height:1.7}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.modal-image{display:block;max-width:100%;max-height:65dvh;margin:auto;object-fit:contain}.toast{position:fixed;right:22px;bottom:22px;z-index:60;padding:11px 16px;border-radius:10px;background:#4b4140;color:#fff;box-shadow:0 8px 22px #0002;font-size:12px}.toast.error{background:var(--wine-deep)}
    @media(max-width:650px){.shell{padding-top:17px}.top-actions{width:100%}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.content{padding:16px}.comment-row{grid-template-columns:58px 1fr;gap:10px}.thumb{width:58px;height:75px}.modal{align-items:end;padding:0}.modal-card{width:100%;border-radius:19px 19px 0 0;padding-bottom:max(23px,env(safe-area-inset-bottom))}.toast{left:16px;right:16px}}
    .content{background:linear-gradient(155deg,#fffcf8,#fcf8f3)}
    .heading{align-items:center}.heading h2{color:#57494a;letter-spacing:.035em}.heading-copy{margin:8px 0 0;color:#9b8981;font-size:12px;letter-spacing:.035em}
    .filters{gap:12px;margin:21px 0 18px}.filters input,.filters select,.modal select{min-height:44px;border-color:#dccfc6;border-radius:11px;background:#fffcf8;transition:border-color .2s ease,box-shadow .2s ease,background .2s ease}.filters :is(input,select):hover,.modal select:hover{border-color:#bba3a2}.filters :is(input,select):focus,.modal select:focus{outline:none;border-color:#a7767d;box-shadow:0 0 0 3px #96546217;background:#fffdfa}.filters input::placeholder{color:#a5978e}
    .comment-list{gap:12px}.comment-row{position:relative;gap:17px;padding:16px;border-color:#e4d9d0;border-radius:14px;background:#fffdfa;box-shadow:0 3px 12px #46372e08;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}.comment-row:hover{transform:translateY(-2px);border-color:#d7c4bd;box-shadow:0 9px 22px #46372e12}.thumb{border-radius:9px;box-shadow:0 3px 10px #46372e12}.comment-meta{gap:10px}.comment-meta strong{font-size:13px;font-weight:600}.comment-text{margin:10px 0 8px;color:#514743;line-height:1.85}.comment-photo{letter-spacing:.01em}.row-actions{gap:8px;margin-top:14px}.row-actions button{min-height:33px;padding:6px 11px;border-radius:9px;transition:background .2s ease,border-color .2s ease,color .2s ease,transform .2s ease}.row-actions button:hover{transform:translateY(-1px)}.row-actions .feature-action{border-color:#c9a4a8;background:#f9eef0;color:var(--wine-deep)}.row-actions .feature-action:hover{border-color:#ac7c83;background:#f5e5e8}.row-actions .subtle-action{color:#827872;background:#fffcf8}.row-actions .danger-action{border-color:#e9d7d3;color:#9b6d6d;background:#fffaf9}.row-actions .danger-action:hover{border-color:#bb8887;background:#fdf2f0;color:#874f52}
    .paging{gap:11px;margin-top:18px}.paging .quiet{min-height:36px;border-radius:10px;background:#fffcf8}.paging #page-label{min-width:44px;color:#6f5b58;text-align:center;font:12px Georgia,serif}.modal{animation:modal-soft-in .22s ease}.modal-card{border:1px solid #eaded6;background:#fffcf8;animation:modal-card-in .25s ease}.primary,.quiet{transition:background .2s ease,border-color .2s ease,color .2s ease,transform .2s ease}.primary:not(:disabled):hover{border-color:var(--wine-deep);transform:translateY(-1px)}
    @keyframes modal-soft-in{from{opacity:0}to{opacity:1}}@keyframes modal-card-in{from{opacity:.7;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:650px){.heading{align-items:flex-start}.heading-copy{max-width:22em}.filters{gap:9px;margin:18px 0}.comment-row{gap:11px;padding:12px}.comment-text{line-height:1.75}.row-actions{gap:6px}.row-actions button{padding-inline:9px}.paging{margin-top:17px}}
    @media(prefers-reduced-motion:reduce){.comment-row,.row-actions button,.primary,.quiet{transition:none!important}.modal,.modal-card{animation:none!important}}
    .row-actions .primary{background:var(--wine);border-color:var(--wine);color:#fff}.row-actions .primary:hover{background:var(--wine-deep);color:#fff}
  </style>
</head>
<body>
  <main class="shell">
    <section class="surface login" id="login" hidden><h1>评论管理</h1><p class="muted">使用照片管理的密码登录。</p><input id="password" type="password" autocomplete="current-password" placeholder="管理密码" aria-label="管理密码"><button class="primary" id="login-button" type="button">登录</button><p id="login-status" class="muted" role="alert"></p></section>
    <section id="panel" hidden><header class="top"><div class="brand"><h1>凡凡and涵涵</h1><p>评论管理</p></div><nav class="top-actions" aria-label="后台导航"><a href="/manage">照片管理</a><a href="/admin/book">书本排版</a><a href="/admin/music">音乐管理</a><a href="/admin/comments" aria-current="page">评论管理</a><a href="/" target="_blank" rel="noopener">查看网站 ↗</a><button id="logout" type="button">退出</button></nav></header>
      <section class="surface content"><div class="heading"><h2>评论管理</h2><span class="muted" id="total">共 0 条</span></div><p class="heading-copy">把值得留下的话，收进我们的书里。</p><div class="filters"><input id="search" type="search" placeholder="搜索昵称或留言" aria-label="搜索评论"><select id="photo-filter" aria-label="按照片筛选"><option value="">全部照片</option></select><select id="status-filter" aria-label="按状态筛选"><option value="">全部状态</option><option value="pending">待审核</option><option value="approved">已通过</option><option value="hidden">已隐藏</option><option value="rejected">未通过</option></select></div><p class="muted" id="status-summary" aria-live="polite"></p><div class="comment-list" id="comment-list"></div><div class="paging"><button class="quiet" id="prev" type="button">上一页</button><span id="page-label">1 / 1</span><button class="quiet" id="next" type="button">下一页</button></div></section>
    </section>
  </main>
  <div class="modal" id="delete-modal" role="dialog" aria-modal="true" aria-label="删除评论" hidden><div class="modal-card"><h2>删除这条评论？</h2><p>删除后无法恢复。若书页正在引用它，前台将不显示该留言。</p><div class="modal-actions"><button class="quiet" id="cancel-delete" type="button">取消</button><button class="primary" id="confirm-delete" type="button">删除</button></div></div></div>
  <div class="modal" id="feature-modal" role="dialog" aria-modal="true" aria-label="选择书页" hidden><div class="modal-card"><h2>设为书本留言</h2><p>选择要显示这条留言的书页。已有留言会被替换，评论本身保留。</p><select id="feature-page" aria-label="选择书页"></select><div class="modal-actions"><button class="quiet" id="cancel-feature" type="button">取消</button><button class="primary" id="confirm-feature" type="button">保存到书本</button></div></div></div>
  <div class="modal" id="photo-modal" role="dialog" aria-modal="true" aria-label="查看照片" hidden><div class="modal-card"><h2 id="photo-modal-title">照片</h2><img class="modal-image" id="photo-modal-image" alt=""><div class="modal-actions"><button class="quiet" id="close-photo" type="button">关闭</button></div></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script>
  (()=>{
    const $=selector=>document.querySelector(selector);
    let photos=[],items=[],page=1,total=0,hasMore=false,deleteId=null,featureId=null,layout=null,toastTimer=0,searchTimer=0,requestToken=0;
    async function api(url,options={}){const response=await fetch(url,{cache:'no-store',...options});let data={};try{data=await response.json()}catch{}if(!response.ok){const error=new Error(data.error||'操作失败，请稍后重试');error.status=response.status;throw error}return data}
    function toast(message,error=false){const box=$('#toast');box.textContent=message;box.classList.toggle('error',error);box.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.hidden=true,3500)}
    function photoFor(id){return photos.find(photo=>photo.id===id)}
    function closeModal(id){$(id).hidden=true;if(['#delete-modal','#feature-modal','#photo-modal'].every(selector=>$(selector).hidden))document.body.classList.remove('modal-open')}
    function openModal(id){$(id).hidden=false;document.body.classList.add('modal-open')}
    async function load(){try{const data=await api('/api/manage/photos');photos=data.photos||[];const filter=$('#photo-filter');filter.replaceChildren(new Option('全部照片',''));for(const photo of photos)filter.add(new Option(photo.title,photo.id));$('#login').hidden=true;$('#panel').hidden=false;await loadComments()}catch(error){if(error.status===401){$('#panel').hidden=true;$('#login').hidden=false}else toast(error.message,true)}}
    async function loadComments(){const token=++requestToken;const query=new URLSearchParams({page:String(page)});if($('#search').value.trim())query.set('search',$('#search').value.trim());if($('#photo-filter').value)query.set('photoId',$('#photo-filter').value);if($('#status-filter').value)query.set('status',$('#status-filter').value);try{const data=await api('/api/manage/comments?'+query);if(token!==requestToken)return;items=data.comments||[];total=data.total;hasMore=data.hasMore;const counts=data.statusCounts||{};$('#status-summary').textContent=`全部 ${Object.values(counts).reduce((a,b)=>a+b,0)} · 待审核 ${counts.pending||0} · 已通过 ${counts.approved||0} · 已隐藏 ${counts.hidden||0} · 未通过 ${counts.rejected||0}`;document.querySelector('a[aria-current="page"]').textContent='评论管理'+(counts.pending?' · '+counts.pending:'');render()}catch(error){toast(error.message,true)}}
    function render(){const root=$('#comment-list');root.replaceChildren();$('#total').textContent=`共 ${total} 条`;$('#page-label').textContent=`${page} / ${Math.max(1,Math.ceil(total/20))}`;$('#prev').disabled=page<=1;$('#next').disabled=!hasMore;if(!items.length){const empty=document.createElement('p');empty.className='muted';empty.textContent='还没有符合条件的留言。';root.append(empty);return}for(const item of items){const photo=photoFor(item.photoId),row=document.createElement('article'),image=document.createElement('img'),main=document.createElement('div'),meta=document.createElement('div'),name=document.createElement('strong'),date=document.createElement('time'),body=document.createElement('p'),source=document.createElement('div'),actions=document.createElement('div');row.className='comment-row';if(item.status==='pending')row.style.borderLeft='3px solid #c9a4a8';image.className='thumb';image.src=photo?.thumbnailSrc||photo?.src||'';image.alt='';image.loading='lazy';main.className='comment-main';meta.className='comment-meta';name.textContent=item.nickname;date.textContent=item.createdAt.slice(0,16).replace('T',' ');meta.append(name,date);{const badge=document.createElement('span');badge.className='badge';badge.textContent={pending:'待审核',approved:'已通过',rejected:'未通过',hidden:'已隐藏'}[item.status];meta.append(badge)}body.className='comment-text';body.textContent=item.content;source.className='comment-photo';source.textContent='照片：'+(photo?.title||'原照片已不存在');actions.className='row-actions';const addButton=(label,handler,kind='')=>{const button=document.createElement('button');button.type='button';button.className='quiet'+(kind?' '+kind:'');button.textContent=label;button.addEventListener('click',handler);actions.append(button);return button};if(photo)addButton('查看照片',()=>{const img=$('#photo-modal-image');img.src=photo.src;img.alt=photo.title;$('#photo-modal-title').textContent=photo.title;openModal('#photo-modal')});if(item.status==='approved'){addButton('设为书本留言',()=>void openFeature(item.id),'feature-action');addButton('隐藏',()=>void changeStatus(item,'hidden'),'subtle-action')}else{const feature=addButton('设为书本留言',()=>{},'feature-action');feature.disabled=true;feature.title='审核通过后才能收进书本。';if(item.status==='pending'){addButton('通过',()=>void changeStatus(item,'approved'),'primary');addButton('拒绝',()=>void changeStatus(item,'rejected'),'subtle-action')}else addButton(item.status==='hidden'?'恢复':'重新通过',()=>void changeStatus(item,'approved'),'feature-action')}addButton('删除',()=>{deleteId=item.id;openModal('#delete-modal')},'danger-action');main.append(meta,body,source,actions);row.append(image,main);root.append(row)}}
    async function changeStatus(item,status){if(item.saving)return;item.saving=true;try{await api('/api/manage/comments/'+encodeURIComponent(item.id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});await loadComments();toast(status==='approved'?'留言已通过审核':status==='rejected'?'留言未通过审核':'评论已隐藏')}catch(error){toast(error.message,true)}finally{item.saving=false}}
    async function openFeature(id){featureId=id;try{const [book,photoData]=await Promise.all([api('/api/book-layout'),api('/api/manage/photos')]);layout=book.configured?{years:structuredClone(book.years)}:{years:{'2026':[],'2027':[]}};if(!book.configured){for(const photo of photoData.photos||[]){if(layout.years[photo.year])layout.years[photo.year].push({id:'page_'+(crypto.randomUUID?.()||Date.now()+'_'+Math.random().toString(36).slice(2)),order:layout.years[photo.year].length+1,layout:'single',photos:[{photoId:photo.id,slot:1}]})}}const select=$('#feature-page');select.replaceChildren();for(const year of ['2026','2027'])for(const [index,entry] of layout.years[year].entries()){const first=photoFor(entry.photos?.[0]?.photoId);select.add(new Option(`${year} · 第 ${index+1} 页${first?' · '+first.title:''}`,year+'|'+entry.id))}if(!select.options.length){toast('请先在书本排版中新增页面',true);return}openModal('#feature-modal')}catch(error){toast(error.message,true)}}
    $('#confirm-feature').addEventListener('click',async()=>{const [year,id]=($('#feature-page').value||'').split('|');const entry=layout?.years?.[year]?.find(page=>page.id===id);if(!entry||!featureId)return;entry.note={type:'comment',commentId:featureId};const button=$('#confirm-feature');button.disabled=true;try{await api('/api/manage/book-layout',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(layout)});closeModal('#feature-modal');featureId=null;toast('已设为书本精选留言')}catch(error){toast(error.message,true)}finally{button.disabled=false}});
    $('#confirm-delete').addEventListener('click',async()=>{if(!deleteId)return;const button=$('#confirm-delete');button.disabled=true;try{await api('/api/manage/comments/'+encodeURIComponent(deleteId),{method:'DELETE'});deleteId=null;closeModal('#delete-modal');await loadComments();toast('评论已删除')}catch(error){toast(error.message,true)}finally{button.disabled=false}});
    $('#cancel-delete').addEventListener('click',()=>{deleteId=null;closeModal('#delete-modal')});$('#cancel-feature').addEventListener('click',()=>{featureId=null;closeModal('#feature-modal')});$('#close-photo').addEventListener('click',()=>closeModal('#photo-modal'));
    for(const id of ['#delete-modal','#feature-modal','#photo-modal'])$(id).addEventListener('click',event=>{if(event.target===$(id))closeModal(id)});
    document.addEventListener('keydown',event=>{if(event.key==='Escape')for(const id of ['#delete-modal','#feature-modal','#photo-modal'])closeModal(id)});
    $('#search').addEventListener('input',()=>{clearTimeout(searchTimer);page=1;searchTimer=setTimeout(loadComments,250)});for(const id of ['#photo-filter','#status-filter'])$(id).addEventListener('change',()=>{page=1;void loadComments()});$('#prev').addEventListener('click',()=>{if(page>1){page--;void loadComments()}});$('#next').addEventListener('click',()=>{if(hasMore){page++;void loadComments()}});
    $('#login-button').addEventListener('click',async()=>{const button=$('#login-button');button.disabled=true;try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#password').value})});$('#password').value='';$('#login-status').textContent='';await load()}catch(error){$('#login-status').textContent=error.message}finally{button.disabled=false}});$('#password').addEventListener('keydown',event=>{if(event.key==='Enter')$('#login-button').click()});$('#logout').addEventListener('click',async()=>{await api('/api/logout',{method:'POST'});$('#panel').hidden=true;$('#login').hidden=false});load();
  })();
  </script>
</body>
</html>
