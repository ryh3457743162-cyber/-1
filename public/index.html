<!doctype html>
<html lang="zh-CN">
<head>
  <!-- Inspired by the MIT-licensed Photo Ring collection: https://github.com/HaichaoLihc/create-photo-flipbook-ui -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1eee8">
  <meta name="description" content="凡凡and涵涵 · 从 2026 延续的照片记忆">
  <title>凡凡and涵涵</title>
  <script>
    try{if(new URLSearchParams(location.search).get('bookPreview')!=='1')document.documentElement.classList.add('story-cover-open')}
    catch{document.documentElement.classList.add('story-cover-open')}
  </script>
  <style>
    :root{
      --paper:#f1eee8;
      --paper-soft:#f8f5ef;
      --ink:#252421;
      --ink-soft:#4b4945;
      --muted:#817d76;
      --line:rgba(56,51,46,.16);
      --rose:#a9626b;
      --rose-deep:#8e4f58;
      --ease:cubic-bezier(.22,.61,.36,1);
      font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;
      color:var(--ink);
      background:var(--paper);
      font-synthesis:none;
    }
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    html,body{width:100%;height:100%;margin:0}
    body{overflow:hidden;background:var(--paper)}
    body.book-mode{overflow-x:hidden;overflow-y:auto}
    button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    button:focus-visible,.stage:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
    .site-shell{opacity:1;transition:opacity 500ms var(--ease)}
    .story-cover-open .site-shell{opacity:0;pointer-events:none}
    .intro-cover{position:fixed;inset:0;z-index:150;overflow:auto;overflow-x:hidden;background:radial-gradient(ellipse at 50% 42%,#fbf9f4 0,#f7f3ec 55%,var(--paper) 100%);opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-10px);transition:opacity 500ms var(--ease),transform 500ms var(--ease),visibility 500ms var(--ease)}
    .intro-cover::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.11;background-image:radial-gradient(#70675d .4px,transparent .6px);background-size:7px 7px;mask-image:linear-gradient(180deg,#0006,transparent 85%)}
    .story-cover-open .intro-cover{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0)}
    .intro-hearts{position:absolute;inset:0;z-index:0;pointer-events:none}
    .intro-heart{position:absolute;color:#a94e59;font:22px/1 Georgia,"Times New Roman",serif;opacity:.72;animation:introHeartFloat 8s ease-in-out infinite alternate}
    .intro-heart:nth-child(2){font-size:18px;opacity:.6;animation-duration:9.5s;animation-delay:-2s}
    .intro-heart:nth-child(3){font-size:25px;opacity:.65;animation-duration:7.5s;animation-delay:-4s}
    @keyframes introHeartFloat{from{transform:translate3d(0,2px,0) rotate(-5deg)}to{transform:translate3d(3px,-6px,0) rotate(4deg)}}
    .intro-inner{position:relative;z-index:1;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:20px;width:min(100%,660px);min-height:100%;margin:auto;padding:max(34px,env(safe-area-inset-top)) clamp(28px,6vw,58px) max(35px,env(safe-area-inset-bottom))}
    .intro-kicker{display:flex;align-items:center;justify-content:space-between;gap:20px;color:#8b847a;font:10px/1.4 Georgia,"Times New Roman",serif;letter-spacing:.26em;white-space:nowrap}
    .intro-kicker::after{content:"";width:31px;height:1px;background:var(--rose);opacity:.72}
    .intro-main{align-self:center;text-align:center;transform:translateY(3vh)}
    .intro-love{margin:0;color:#a84250;font-family:"Segoe Script","Lucida Handwriting","Brush Script MT",cursive;font-size:clamp(56px,11vw,84px);font-style:italic;font-weight:600;letter-spacing:.01em;line-height:1.3;white-space:nowrap}
    .intro-story{margin:29px 0 0;color:var(--rose-deep);font:400 11px/1.5 Georgia,"Times New Roman",serif;letter-spacing:.38em}
    .intro-years{margin:8px 0 0;color:#625d57;font:400 clamp(21px,5vw,27px)/1.4 Georgia,"Times New Roman",serif;letter-spacing:.1em}
    .intro-bottom{display:flex;flex-direction:column;align-items:center;text-align:center}
    .intro-quote{margin:0;color:#5e5953;font-size:clamp(12px,3.2vw,14px);font-weight:400;line-height:2.05;letter-spacing:.11em}
    .intro-enter{display:inline-flex;align-items:center;justify-content:center;gap:13px;min-height:50px;margin-top:clamp(26px,5vh,48px);padding:8px 5px;border:0;border-bottom:1px solid rgba(84,77,70,.38);border-radius:0;background:transparent;color:var(--ink);font-size:12px;font-weight:500;letter-spacing:.14em;transition:color 260ms var(--ease),border-color 260ms var(--ease),opacity 260ms var(--ease)}
    .intro-enter:hover{color:var(--rose-deep);border-color:var(--rose)}
    .intro-enter:active{opacity:.65}
    .intro-enter .arrow{font:21px/1 Georgia,"Times New Roman",serif;transition:transform 260ms var(--ease)}
    .intro-enter:hover .arrow{transform:translateX(4px)}
    .story-cover-open .intro-kicker{animation:introReveal 450ms var(--ease) 80ms both}
    .story-cover-open .intro-love{animation:introReveal 450ms var(--ease) 150ms both}
    .story-cover-open .intro-story{animation:introReveal 450ms var(--ease) 300ms both}
    .story-cover-open .intro-years{animation:introReveal 450ms var(--ease) 450ms both}
    .story-cover-open .intro-quote{animation:introReveal 450ms var(--ease) 600ms both}
    .story-cover-open .intro-enter{animation:introReveal 450ms var(--ease) 750ms both}
    @keyframes introReveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none;background:radial-gradient(circle at 50% 43%,#faf8f3 0,#f4f1eb 34%,var(--paper) 72%)}
    .stage.dragging{cursor:grabbing}
    .grain{position:absolute;inset:0;pointer-events:none;opacity:.12;background-image:radial-gradient(#56514a .45px,transparent .65px);background-size:7px 7px;mask-image:linear-gradient(#0007,transparent 72%)}
    .orbit-line{position:absolute;left:50%;top:49%;width:min(69vw,940px);height:min(55vh,560px);border:1px solid rgba(105,99,91,.22);border-radius:50%;transform:translate(-50%,-50%);opacity:.72;pointer-events:none;transition:opacity 360ms var(--ease),transform 420ms var(--ease)}
    .orbit-line::after{content:"";position:absolute;inset:10px;border:1px solid rgba(105,99,91,.07);border-radius:inherit}
    .stage[data-view="gallery"] .orbit-line,.stage[data-view="book"] .orbit-line{opacity:0;transform:translate(-50%,-50%) scale(.94)}
    .stage[data-view="atlas"] .orbit-line{width:min(72vw,980px);height:min(49vh,500px);opacity:.46;border-color:rgba(142,79,88,.2);transform:translate(-50%,-50%) perspective(900px) rotateX(58deg) scale(.98)}
    .stage[data-view="atlas"] .orbit-line::before{content:"";position:absolute;inset:18%;border:1px solid rgba(105,99,91,.11);border-radius:inherit}
    .stage[data-view="atlas"] .orbit-line::after{inset:-11%;border-color:rgba(105,99,91,.09)}
    .center{position:absolute;left:50%;top:48.5%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:2000;min-width:230px}
    .love-mark{display:block;margin:0 0 8px;color:var(--rose);font-family:Georgia,"Times New Roman",serif;font-size:clamp(10px,1vw,13px);font-weight:600;letter-spacing:.29em;line-height:1.2;white-space:nowrap;text-transform:uppercase}
    .love-mark span{font-size:.84em;vertical-align:.08em}
    .year-switch{display:flex;align-items:center;justify-content:center;gap:clamp(4px,1vw,13px);pointer-events:auto}
    .year{border:0;background:transparent;color:var(--ink);font-family:Georgia,"Times New Roman",serif;font-size:clamp(70px,8.2vw,118px);font-weight:400;line-height:.9;letter-spacing:-.065em;padding:3px 7px 7px;text-shadow:0 1px 0 #fff8;transition:color 300ms var(--ease),transform 300ms var(--ease),opacity 300ms var(--ease)}
    .year:hover{color:var(--rose-deep)}
    .year.is-changing{animation:yearShift 360ms var(--ease)}
    .year-arrow{display:grid;place-items:center;width:42px;height:42px;border:0;border-radius:50%;background:transparent;color:#8d8982;font:38px/1 Georgia,"Times New Roman",serif;padding:0 0 5px;transition:color 240ms var(--ease),background 240ms var(--ease),transform 240ms var(--ease)}
    .year-arrow:hover{color:var(--rose-deep);background:rgba(169,98,107,.08);transform:scale(1.05)}
    .center .sub{display:block;margin-top:9px;font-size:10px;font-weight:500;letter-spacing:.14em;color:var(--muted);text-transform:lowercase}
    .card{position:absolute;left:50%;top:50%;width:160px;height:210px;margin:0;visibility:hidden;will-change:transform,opacity;transform-origin:center;backface-visibility:hidden;cursor:zoom-in;transition:opacity 280ms var(--ease)}
    .card-inner{position:relative;display:block;width:100%;height:100%;transform-origin:center;animation:photoFloat var(--float-duration,8s) ease-in-out var(--float-delay,0s) infinite alternate}
    .card-comment-count{position:absolute;right:5px;bottom:5px;border:1px solid #ffffffad;border-radius:99px;padding:4px 7px;background:#fffcf4e8;color:#77565c;font:10px Georgia,serif;letter-spacing:.03em;box-shadow:0 2px 8px #33282018;pointer-events:none}
    .card-inner::before{content:"";position:absolute;inset:3px;background:#fcfaf6;box-shadow:0 10px 30px rgba(49,43,37,.10);transform:translate(3px,-3px) rotate(.8deg)}
    .card img{position:relative;z-index:1;display:block;width:100%;height:100%;object-fit:cover;border:6px solid #fbfaf7;background:#dedbd5;box-shadow:0 9px 25px rgba(48,43,38,.14);pointer-events:none}
    .stage[data-view="book"]{position:relative;inset:auto;height:100dvh;min-height:460px;touch-action:pan-y;cursor:default;background:radial-gradient(ellipse at 50% 48%,#fffdfa 0,#f7f3ed 52%,var(--paper) 100%)}
    .stage[data-view="book"] #cards{display:none}
    .stage[data-view="book"] .center{display:none}
    .book-reader{position:absolute;left:50%;top:53%;z-index:8;display:flex;flex-direction:column;align-items:center;gap:12px;width:min(86vw,960px,calc((100dvh - clamp(290px,36.5vh,330px))*1.52));max-width:calc(100vw - 28px);transform:translate(-50%,-50%);pointer-events:auto}
    .book-object{position:relative;width:100%;aspect-ratio:1.52;perspective:1600px;transform-style:preserve-3d;touch-action:none;cursor:grab;filter:drop-shadow(0 18px 28px rgba(58,48,39,.10))}
    .book-object.dragging{cursor:grabbing}
    .book-object::before{content:"";position:absolute;inset:6px -4px -4px;background:#e9e3d9;border:1px solid #e2dbd1;border-radius:3px;transform:translateY(4px);z-index:-1}
    .book-page{position:absolute;top:0;width:50%;height:100%;display:flex;flex-direction:column;overflow:hidden;background:#fffcf7;border:1px solid #ebe6de;backface-visibility:hidden;-webkit-backface-visibility:hidden}
    .book-page.left{left:0;border-radius:3px 0 0 3px;background:linear-gradient(90deg,#f6f0e7 0,#fffdf8 11%,#fffdf8 87%,#e8e0d6 100%)}
    .book-page.right{right:0;border-radius:0 3px 3px 0;background:linear-gradient(90deg,#e8e0d6 0,#fffdf8 13%,#fffdf8 89%,#f6f0e7 100%)}
    .book-object::after{content:"";position:absolute;left:calc(50% - 2px);top:0;bottom:0;width:4px;z-index:5;background:linear-gradient(90deg,#92887922,#fff9,#665d531c);pointer-events:none}
    .book-photo-frame{display:grid;place-items:center;flex:1;min-height:0;margin:clamp(12px,1.8vw,24px) clamp(11px,1.7vw,24px) clamp(8px,1.2vw,15px);padding:clamp(5px,.7vw,9px);background:#fff;box-shadow:0 5px 18px rgba(50,42,34,.07);overflow:hidden}
    .book-photo-frame img{display:block;width:100%;height:100%;object-fit:contain;background:#ece8e1;pointer-events:none}
    .book-layout-grid{display:grid;flex:1;min-height:0;gap:clamp(4px,.75vw,10px);margin:clamp(12px,1.8vw,24px) clamp(11px,1.7vw,24px) clamp(8px,1.2vw,15px)}
    .book-layout-slot{position:relative;display:grid;place-items:center;min-width:0;min-height:0;overflow:hidden;background:transparent}
    .book-layout-slot img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
    .book-layout-grid[data-layout="single"] img{object-fit:contain}
    .book-layout-slot.missing{background:#f7f3ed;color:#a1988f;font-size:clamp(8px,.8vw,11px);text-align:center}
    .book-note{grid-area:var(--note-area);display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:0;overflow:hidden;padding:clamp(12px,2vw,32px);color:#544b47;text-align:center;font-family:"KaiTi","STKaiti","Songti SC",Georgia,serif}
    .book-note::before{content:"♡";display:block;margin-bottom:clamp(5px,.8vw,12px);color:#a88084;font:clamp(11px,1vw,15px) Georgia,serif;opacity:.65}
    .book-note time{display:block;color:#9c8e86;font:clamp(9px,.72vw,11px) Georgia,serif;letter-spacing:.18em}.book-note p{max-width:24em;margin:clamp(8px,1.2vw,17px) 0;overflow-wrap:anywhere;white-space:pre-wrap;font-size:clamp(12px,1.22vw,19px);font-weight:400;letter-spacing:.045em;line-height:1.95}.book-note small{align-self:flex-end;margin-right:clamp(2px,.7vw,9px);color:#895f65;font:clamp(10px,.92vw,14px) "KaiTi","STKaiti","Songti SC",Georgia,serif;letter-spacing:.08em}
    .book-note.inline{flex:none;max-height:27%;padding:3px 17px 7px}.book-note.inline::before{display:none}.book-note.inline p{margin:3px 0;font-size:clamp(9px,.82vw,13px);line-height:1.4}.book-note.inline small{font-size:10px}
    @media(max-width:600px){.book-note{padding:2px 4px}.book-note::before{margin-bottom:2px;font-size:9px}.book-note p{margin:3px 0;font-size:clamp(9px,2.2vw,12px);line-height:1.45}.book-note small,.book-note time{font-size:8px}}
    .book-page-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 clamp(11px,1.7vw,24px) clamp(10px,1.3vw,17px);color:#827a70;font-size:clamp(8px,.72vw,10px);letter-spacing:.04em}
    .book-page-foot span:first-child{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
    .book-page-foot span:last-child{font-family:Georgia,"Times New Roman",serif;letter-spacing:.12em}
    .book-cover{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--ink-soft);text-align:center}
    .book-cover .heart{color:var(--rose);font-size:18px}
    .book-cover strong{font-family:Georgia,"Songti SC","SimSun",serif;font-size:clamp(18px,2.2vw,31px);font-weight:400;letter-spacing:.08em}
    .book-cover small{color:#958c82;font-family:Georgia,"Times New Roman",serif;font-size:clamp(10px,1vw,13px);letter-spacing:.16em}
    .book-leaf{position:absolute;top:0;left:50%;width:50%;height:100%;z-index:7;transform-style:preserve-3d;pointer-events:none}
    .book-strip{position:absolute;top:0;height:100%;transform-origin:left center;transform-style:preserve-3d;backface-visibility:hidden;will-change:transform}
    .book-strip-face{position:absolute;inset:0;overflow:hidden;background:#fffcf7;backface-visibility:hidden;-webkit-backface-visibility:hidden}
    .book-strip-face.back{transform:rotateY(180deg)}
    .book-strip-face::after{content:"";position:absolute;inset:0;background:#4a382c;opacity:var(--strip-shade,0);pointer-events:none}
    .book-strip-content{position:absolute;top:0;height:100%;display:flex;flex-direction:column;background:#fffcf7}
    .book-object.turn-next .book-page.right::after,.book-object.turn-prev .book-page.left::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:var(--page-shadow,0);background:linear-gradient(90deg,rgba(39,29,22,.26),transparent 55%,rgba(39,29,22,.08))}
    .book-object.edge-next .book-page.right{transform-origin:left center;transform:rotateY(-3deg);box-shadow:5px 7px 15px rgba(60,50,42,.1)}
    .book-object.edge-prev .book-page.left{transform-origin:right center;transform:rotateY(3deg);box-shadow:-5px 7px 15px rgba(60,50,42,.1)}
    .book-page{transition:transform 260ms var(--ease),box-shadow 260ms var(--ease)}
    .book-controls{display:flex;align-items:center;justify-content:center;gap:clamp(20px,3vw,38px);color:#77716a;font:12px/1 Georgia,"Times New Roman",serif;letter-spacing:.12em;white-space:nowrap}
    .book-controls button{display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:#6c6760;font:28px/1 Georgia,serif;padding-bottom:3px;transition:background 240ms var(--ease),color 240ms var(--ease)}
    .book-controls button:hover{background:#ffffff9c;color:var(--rose-deep)}
    .book-controls button:disabled{opacity:.35;cursor:default}
    .book-years{display:flex;align-items:center;justify-content:center;gap:27px;margin-top:2px}
    .book-year{min-width:54px;min-height:28px;padding:2px 0;border:0;border-bottom:1px solid transparent;background:transparent;color:#a8a198;font:12px/1 Georgia,"Times New Roman",serif;letter-spacing:.15em;transition:color 260ms var(--ease),border-color 260ms var(--ease)}
    .book-year:hover{color:var(--rose-deep)}
    .book-year[aria-pressed="true"]{color:var(--ink-soft);border-bottom-color:#9b746d}
    .topbar,.bottombar{position:fixed;left:0;right:0;z-index:30;pointer-events:none}
    .topbar>* ,.bottombar>*{pointer-events:auto}
    .topbar{top:0;display:grid;grid-template-columns:minmax(190px,1fr) auto minmax(70px,1fr);align-items:center;gap:16px;padding:18px clamp(20px,3vw,42px);background:linear-gradient(180deg,rgba(241,238,232,.98) 0,rgba(241,238,232,.78) 64%,transparent 100%)}
    .brand{border:0;background:transparent;color:inherit;text-align:left;padding:0;font-family:Georgia,"Songti SC","SimSun",serif;font-size:clamp(20px,2vw,28px);font-weight:400;letter-spacing:.055em;line-height:1;white-space:nowrap;transition:color 260ms var(--ease)}
    .brand:hover{color:var(--rose-deep)}
    .brand .amp{color:var(--rose);font-style:italic;margin:0 .12em}
    .brand small{display:block;margin-top:8px;color:var(--muted);font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:9px;font-weight:500;letter-spacing:.32em}
    .tools,.views{display:flex;align-items:center;gap:7px}
    .tools{justify-content:flex-end}
    .views{justify-content:center;gap:2px;padding:3px;border-radius:999px;background:rgba(91,84,77,.075)}
    .views .pill{border:0;background:transparent;box-shadow:none;color:#746e67;height:29px;padding:0 17px}
    .views .pill:hover{border:0;background:rgba(255,255,255,.45);color:var(--ink-soft)}
    .views .pill[aria-pressed="true"]{border:0;background:rgba(255,255,255,.86);color:#45413e;box-shadow:0 1px 4px rgba(58,48,39,.07)}
    .pill{height:34px;border:1px solid rgba(70,65,59,.17);border-radius:999px;background:rgba(255,255,255,.28);color:#69655f;padding:0 15px;font-size:11px;font-weight:500;letter-spacing:.08em;white-space:nowrap;transition:color 260ms var(--ease),background 260ms var(--ease),border-color 260ms var(--ease),transform 260ms var(--ease),box-shadow 260ms var(--ease)}
    .pill:hover{border-color:rgba(70,65,59,.34);color:var(--ink);background:rgba(255,255,255,.5)}
    .pill[aria-pressed="true"],.pill.primary{border-color:#55514d;background:#55514d;color:#faf8f3;box-shadow:0 5px 16px rgba(46,42,38,.11)}
    .pill:active{transform:scale(.97)}
    label.pill{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
    .bottombar{bottom:0;display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:end;gap:clamp(18px,4vw,64px);padding:17px clamp(20px,3vw,42px) 22px;background:linear-gradient(0deg,rgba(241,238,232,.99) 0,rgba(241,238,232,.93) 72%,rgba(241,238,232,0) 100%)}
    .stage[data-view="book"] ~ .topbar .brand{font-size:clamp(18px,1.7vw,23px);letter-spacing:.08em;color:#4f4b46}
    .stage[data-view="book"] ~ .topbar .brand small{display:none}
    .stage[data-view="book"] ~ .bottombar{position:relative;left:auto;right:auto;bottom:auto;z-index:1;min-height:170px;padding-top:54px;padding-bottom:max(42px,env(safe-area-inset-bottom));background:var(--paper)}
    .bottombar::before{content:"";position:absolute;left:clamp(20px,3vw,42px);right:clamp(20px,3vw,42px);top:7px;height:1px;background:linear-gradient(90deg,var(--rose) 0 34px,var(--line) 34px 100%)}
    .meta{display:flex;min-width:0;flex-direction:column;gap:5px;max-width:min(46vw,560px)}
    .eyebrow{font-size:9px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--rose-deep)}
    .title{font-family:Georgia,"Songti SC","SimSun",serif;font-size:clamp(18px,2.1vw,28px);font-weight:400;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .detail{font-size:11px;letter-spacing:.04em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .story-nav{display:flex;align-items:center;gap:10px;align-self:center;color:var(--muted);font-family:Georgia,"Times New Roman",serif;font-size:11px;letter-spacing:.08em}
    .story-nav button{display:grid;place-items:center;width:30px;height:30px;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.3);color:var(--ink-soft);font:22px/1 Georgia,serif;padding:0 0 3px;transition:all 240ms var(--ease)}
    .story-nav button:hover{border-color:var(--rose);color:var(--rose-deep);background:#fff9}
