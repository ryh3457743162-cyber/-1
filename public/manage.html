<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ZMF&amp;RYH · 照片管理</title>
  <style>
    :root{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#38332f;background:#f4f1eb;--paper:#f4f1eb;--surface:#fffcf8;--wine:#99515d;--wine-deep:#7d3d49;--muted:#817a73;--line:rgba(82,69,59,.12);--ease:cubic-bezier(.22,.61,.36,1)}
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    body{margin:0;min-height:100vh;background:var(--paper)}
    body.modal-open{overflow:hidden}
    button,input,select{font:inherit}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.46}
    button,input,select,a{transition:color .2s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease,opacity .2s ease,transform .2s ease}
    :is(button,input,select,a,[role="button"]):focus-visible{outline:2px solid var(--wine);outline-offset:3px}
    .shell{width:min(1400px,calc(100% - 48px));margin:auto;padding:26px 0 78px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}
    .brand h1{margin:0;font:400 clamp(22px,2.5vw,32px)/1.16 Georgia,"Songti SC",serif;letter-spacing:.055em}
    .brand p{margin:5px 0 0;color:var(--muted);font-size:11px;letter-spacing:.18em}
    .top-actions{display:flex;align-items:center;gap:9px;white-space:nowrap}
    .top-actions a,.top-actions button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:7px 15px;border-radius:999px;font-size:12px;text-decoration:none}
    .top-actions a:not(.site-link){color:#69615b}
    .top-actions a[aria-current="page"]{background:#e9e3dc;color:#4d4140}
    .top-actions a:not(.site-link):hover{background:#ffffffa0;color:var(--wine-deep)}
    .site-link{border:1px solid var(--line);background:#ffffffa8;color:#55504b}
    .site-link:hover{border-color:#b6a49b;background:#fff;color:var(--wine-deep)}
    .logout{border:0;background:transparent;color:#837b73}
    .logout:hover{color:var(--wine-deep);background:#ffffff70}
    .surface{background:var(--surface);border:1px solid rgba(92,76,65,.08);border-radius:20px;box-shadow:0 10px 32px rgba(59,47,39,.045)}
    .login{width:min(430px,100%);margin:12vh auto;padding:28px}
    .login h1{margin:0;font:400 30px Georgia,"Songti SC",serif}
    .muted{color:var(--muted);font-size:12px;line-height:1.6}
    .login input{width:100%;min-height:44px;margin:14px 0;padding:10px 15px;border:1px solid var(--line);border-radius:11px;background:#fff;color:inherit}
    .primary{min-height:43px;padding:9px 20px;border:1px solid var(--wine);border-radius:11px;background:var(--wine);color:#fff;font-size:13px;font-weight:600}
    .primary:not(:disabled):hover{border-color:var(--wine-deep);background:var(--wine-deep);transform:translateY(-1px)}
    .status{margin:10px 0 0;color:var(--muted);font-size:12px;line-height:1.5}
    .status:empty{display:none}
    .status.error{color:var(--wine-deep)}
    .upload-panel{padding:clamp(20px,2.4vw,30px)}
    .section-heading{display:flex;align-items:baseline;gap:12px;margin-bottom:20px}
    .section-heading h2,.library-title h2{margin:0;font:400 clamp(19px,2vw,24px) Georgia,"Songti SC",serif;letter-spacing:.03em}
    .section-heading p{margin:0;color:var(--muted);font-size:12px}
    .year-field{display:flex;align-items:center;gap:15px;margin-bottom:18px}
    .year-field label{font-size:12px;font-weight:600;letter-spacing:.08em}
    .year-field select{min-width:140px;min-height:40px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#48423e}
    .file-input{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;clip-path:inset(50%)}
    .dropzone{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:186px;padding:22px;border:1px dashed #cbbeb4;border-radius:17px;background:#faf8f4;text-align:center;cursor:pointer}
    .dropzone:hover,.dropzone.is-over{border-color:var(--wine);background:#fbf6f3}
    .drop-icon{display:grid;place-items:center;width:38px;height:38px;margin-bottom:11px;border-radius:50%;background:#eee4e2;color:var(--wine);font:30px/1 Georgia,serif}
    .dropzone strong{font-size:15px;font-weight:600}
    .dropzone span:not(.drop-icon){margin-top:5px;color:#716961;font-size:13px}
    .dropzone small{margin-top:14px;color:#9a9189;font-size:11px;letter-spacing:.04em}
    .selection{margin-top:18px}
    .selection-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#625b55;font-size:13px;font-weight:600}
    .preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:10px;margin-top:11px}
    .preview{position:relative;min-width:0}
    .preview-image{display:grid;place-items:center;width:100%;aspect-ratio:1;overflow:hidden;border-radius:10px;background:#ece7e0;color:#8d8179;font-size:11px}
    .preview-image img{width:100%;height:100%;object-fit:cover}
    .preview-name{display:block;overflow:hidden;margin-top:5px;color:var(--muted);font-size:10px;white-space:nowrap;text-overflow:ellipsis}
    .preview-remove{position:absolute;right:-5px;top:-5px;display:grid;place-items:center;width:26px;height:26px;padding:0;border:0;border-radius:50%;background:#514943;color:#fff;font-size:17px;line-height:1;box-shadow:0 2px 7px #0002}
    .preview-remove:hover{background:var(--wine-deep)}
    .upload-actions{display:flex;align-items:center;gap:16px;min-height:45px;margin-top:18px}
    .upload-actions .primary{min-width:154px}
    .upload-actions .status{margin:0}
    .library{margin-top:26px}
    .library-title{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
    .library-title span{color:var(--muted);font-size:12px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .year-filters{display:flex;align-items:center;gap:3px;padding:3px;border-radius:999px;background:#eae6df}
    .year-filters button{min-width:57px;min-height:35px;padding:6px 13px;border:0;border-radius:999px;background:transparent;color:#746c65;font-size:12px}
    .year-filters button[aria-pressed="true"]{background:#fffdfa;color:#5a4848;box-shadow:0 1px 5px #4e403016}
    .toolbar-right{display:flex;align-items:center;gap:10px;margin-left:auto}
    .search{width:clamp(170px,19vw,245px);min-height:40px;padding:8px 13px;border:1px solid var(--line);border-radius:10px;background:#fffcf8;color:inherit;font-size:12px}
    .quiet-action{min-height:40px;padding:8px 15px;border:1px solid var(--line);border-radius:10px;background:#fffcf8;color:#625952;font-size:12px}
    .quiet-action:hover{border-color:#b4a49a;color:var(--wine-deep);background:#fff}
    .batch-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;color:#625a54;font-size:12px}
    .batch-actions strong{margin-right:4px}
    .batch-actions button{min-height:40px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:#fffcf8;color:#5f5751;font-size:12px}
    .batch-actions button.danger{border-color:#b77b83;background:#a35c67;color:#fff}
    .batch-actions button.danger:not(:disabled):hover{background:var(--wine-deep)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:17px;margin-top:18px}
    .photo{position:relative;min-width:0;overflow:hidden;border:1px solid rgba(96,80,69,.08);border-radius:15px;background:#fffcf8;box-shadow:0 3px 15px rgba(54,45,38,.035);transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s ease}
    .photo:hover{transform:translateY(-2px);box-shadow:0 9px 23px rgba(54,45,38,.085)}
    .photo.is-selected{border-color:#b9878e;box-shadow:0 0 0 2px #b9878e33}
    .photo-media{position:relative;overflow:hidden;background:#e8e2da}
    .photo-media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,19,18,.25),transparent 32%);opacity:0;pointer-events:none;transition:opacity .2s ease}
    .photo:hover .photo-media::after,.photo:focus-within .photo-media::after,.photo.menu-open .photo-media::after{opacity:1}
    .photo-media img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center;background:#e8e2da}
    .photo-action,.photo-select{position:absolute;top:9px;z-index:3;display:grid;place-items:center;width:40px;height:40px;padding:0;border:0;border-radius:50%;background:rgba(255,252,248,.88);color:#524943;box-shadow:0 2px 9px rgba(0,0,0,.09)}
    .photo-action{right:9px;opacity:0;font-size:23px;line-height:1}
    .photo:hover .photo-action,.photo:focus-within .photo-action,.photo.menu-open .photo-action{opacity:1}
    .photo-action:hover,.photo-select:hover{background:#fff;color:var(--wine-deep)}
    .photo-select{left:9px;display:none;font-size:21px}
    .is-batch .photo-select{display:grid}
    .is-batch .photo-action{display:none}
    .photo.is-selected .photo-select{background:var(--wine);color:#fff}
    .photo-menu{position:absolute;right:9px;top:54px;z-index:5;min-width:130px;padding:5px;border:1px solid var(--line);border-radius:11px;background:#fffdfa;box-shadow:0 10px 24px rgba(41,31,28,.16)}
    .photo-menu button{width:100%;min-height:38px;padding:7px 11px;border:0;border-radius:7px;background:transparent;color:var(--wine-deep);font-size:12px;text-align:left}
    .photo-menu button:hover{background:#f6eceb}
    .photo-info{padding:12px 12px 14px}
    .photo-info strong{display:block;overflow:hidden;color:#46403b;font-size:13px;font-weight:600;white-space:nowrap;text-overflow:ellipsis}
    .photo-info small{display:block;margin-top:6px;color:#969088;font-size:10px;letter-spacing:.05em}
    .empty-state{margin:28px 0;color:var(--muted);font-size:13px;text-align:center}
    .load-more{display:block;min-height:40px;margin:25px auto 0;padding:8px 22px;border:1px solid var(--line);border-radius:999px;background:#fffcf8;color:#6c625a;font-size:12px}
    .load-more:hover{border-color:#b4a49a;color:var(--wine-deep)}
    .modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px}
    .modal-backdrop{position:absolute;inset:0;background:rgba(31,25,23,.46)}
    .modal-dialog{position:relative;width:min(390px,100%);padding:27px;border-radius:18px;background:#fffcf8;box-shadow:0 22px 65px rgba(20,14,12,.19);animation:modalIn .2s var(--ease)}
    .modal-dialog h2{margin:0;font:400 23px Georgia,"Songti SC",serif}
    .modal-dialog p{margin:12px 0 24px;color:#766e67;font-size:13px;line-height:1.7}
    .modal-actions{display:flex;justify-content:flex-end;gap:10px}
    .modal-actions button{min-width:90px;min-height:41px;padding:8px 16px;border-radius:10px;font-size:12px}
    .modal-cancel{border:1px solid var(--line);background:#fff;color:#5f5852}
    .modal-confirm{border:1px solid var(--wine);background:var(--wine);color:#fff}
    .modal-confirm:not(:disabled):hover{background:var(--wine-deep)}
    .edit-dialog{max-height:calc(100dvh - 40px);overflow:auto}
    .edit-preview{display:block;width:100%;height:145px;object-fit:contain;margin:18px 0;background:#f3eee7;border-radius:10px}
    .edit-dialog label{display:block;margin:14px 0 6px;color:#665b54;font-size:13px}
    .edit-dialog input{width:100%;min-width:0;min-height:42px;box-sizing:border-box}
    .edit-dialog input:focus{outline:2px solid #b4848b55;outline-offset:1px}
    .edit-dialog .edit-help{margin:6px 0;color:#8c8178;font-size:11px}
    .edit-dialog .edit-error{margin:12px 0;color:var(--wine-deep);font-size:12px}
    .edit-dialog .modal-actions{margin-top:18px}
    .edit-info{margin-top:9px;padding:5px 0;border:0;background:transparent;color:var(--wine-deep);font-size:12px}
    .toast{position:fixed;right:24px;bottom:24px;z-index:110;max-width:min(390px,calc(100vw - 32px));padding:12px 17px;border-radius:11px;background:#524842;color:#fff;font-size:12px;line-height:1.5;box-shadow:0 9px 25px #24181525;animation:toastIn .2s var(--ease)}
    .toast.error{background:var(--wine-deep)}
    @keyframes modalIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
    @keyframes toastIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    @media(hover:none){.photo-action{opacity:1}.photo-media::after{display:none}}
    @media(max-width:720px){.shell{width:calc(100% - 30px);padding-top:20px}.top{align-items:flex-start}.grid{grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:13px}.toolbar-right{margin-left:0}}
    @media(max-width:560px){.top{flex-wrap:wrap;gap:12px;margin-bottom:19px}.top-actions{width:100%;justify-content:flex-start;flex-wrap:wrap}.upload-panel{padding:17px}.section-heading{display:block;margin-bottom:16px}.section-heading p{margin-top:4px}.year-field{display:block}.year-field label{display:block;margin-bottom:8px}.year-field select{width:100%}.dropzone{min-height:172px}.upload-actions{align-items:stretch;flex-direction:column;gap:8px}.upload-actions .primary{width:100%}.toolbar{align-items:stretch}.toolbar-right{width:100%}.search{flex:1;min-width:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.photo-info{padding:10px}.toast{left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom))}}
    @media(max-width:360px){.top-actions a,.top-actions button{padding-inline:12px}.photo-info strong{font-size:12px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="surface login" id="login">
      <h1>照片管理</h1><p class="muted">登录后可以发布或移到回收站。</p>
      <input id="password" type="password" autocomplete="current-password" placeholder="管理密码" aria-label="管理密码">
      <button class="primary" id="login-button" type="button">登录</button>
      <p class="status error" id="login-status" role="alert"></p>
    </section>
    <section id="panel" hidden>
      <header class="top">
        <div class="brand"><h1>ZMF&amp;RYH</h1><p>照片管理</p></div>
        <nav class="top-actions" aria-label="后台导航"><a href="/manage" aria-current="page">照片管理</a><a href="/admin/book">书本排版</a><a href="/admin/music">音乐管理</a><a href="/admin/comments">评论管理</a><a href="/admin/trash">回收站</a><a href="/admin/analytics">访问统计</a><a class="site-link" href="/" target="_blank" rel="noopener">查看网站 <span aria-hidden="true">↗</span></a><button class="logout" id="logout" type="button">退出</button></nav>
      </header>
      <section class="surface upload-panel" aria-labelledby="upload-title">
        <div class="section-heading"><h2 id="upload-title">发布照片</h2><p>把新的回忆收藏进年轮。</p></div>
        <form id="upload">
          <div class="year-field"><label for="year">归档年份</label><select id="year" name="year"><option>2026</option><option>2027</option></select></div>
          <input class="file-input" id="photos" name="photos" type="file" accept="image/*,.heic,.heif" multiple>
          <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="选择照片或拖入照片">
            <span class="drop-icon" aria-hidden="true">＋</span><strong>拖入照片到这里</strong><span>或点击选择照片</span>
            <small>JPG / PNG / WebP / HEIC · 支持一次选择多张照片</small>
          </div>
          <div class="selection" id="selection" hidden>
            <div class="selection-heading"><span id="selection-count"></span></div>
            <div class="preview-grid" id="preview-grid"></div>
          </div>
          <label id="oss-test-option" hidden><input id="oss-test" type="checkbox"> 测试上传到 OSS（验证完成前不会切换正式上传）</label>
          <div class="upload-actions"><button class="primary" id="publish" type="submit" disabled>发布照片</button><p class="status" id="status" role="status" aria-live="polite"></p></div>
        </form>
      </section>
      <section class="library" id="library" aria-label="照片管理列表">
        <div class="library-title"><h2>照片</h2><span id="photo-count">共 0 张</span></div>
        <div class="toolbar">
          <div class="year-filters" role="group" aria-label="筛选年份">
            <button type="button" data-year="all">全部</button><button type="button" data-year="2026">2026</button><button type="button" data-year="2027">2027</button>
          </div>
          <div class="toolbar-right"><input class="search" id="search" type="search" placeholder="搜索照片" aria-label="搜索照片"><button class="quiet-action" id="batch-toggle" type="button">批量管理</button></div>
        </div>
        <div class="batch-actions" id="batch-actions" hidden><strong id="selected-count">已选择 0 张</strong><button id="clear-selection" type="button">取消选择</button><button class="danger" id="batch-delete" type="button" disabled>移到回收站 0 张</button></div>
        <p class="empty-state" id="empty-state" hidden></p>
        <div class="grid" id="grid"></div>
        <button class="load-more" id="load-more" type="button" hidden>加载更多</button>
      </section>
    </section>
  </main>
  <div class="modal" id="delete-modal" role="dialog" aria-modal="true" aria-labelledby="delete-title" hidden>
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-dialog"><h2 id="delete-title">移到回收站？</h2><p id="delete-message">照片可以从回收站恢复，原图和相关留言暂时不会删除。</p><div class="modal-actions"><button class="modal-cancel" id="cancel-delete" type="button">取消</button><button class="modal-confirm" id="confirm-delete" type="button">移到回收站</button></div></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="modal" id="edit-modal" role="dialog" aria-modal="true" aria-labelledby="edit-heading" hidden>
    <div class="modal-backdrop" id="edit-backdrop"></div>
    <form class="modal-dialog edit-dialog" id="edit-form">
      <h2 id="edit-heading">编辑照片信息</h2>
      <img class="edit-preview" id="edit-preview" alt="当前照片">
      <label for="edit-title">照片名称</label><input id="edit-title" required maxlength="60" autocomplete="off">
      <label for="edit-date">拍摄日期</label><input id="edit-date" type="date" min="0001-01-01" max="9999-12-31">
      <p class="edit-help">日期未知时可以清空。不会改变书本排版或归档年份。</p>
      <label for="edit-uploaded">上传时间</label><input id="edit-uploaded" readonly>
      <p class="edit-error" id="edit-error" role="alert" hidden></p>
      <div class="modal-actions"><button class="modal-cancel" id="cancel-edit" type="button">取消</button><button class="modal-confirm" id="save-edit" type="submit">保存修改</button></div>
    </form>
  </div>
  <script>
    const $ = selector => document.querySelector(selector);
    const login = $('#login'), panel = $('#panel'), grid = $('#grid');
    const selectedFiles = new Map();
    const selectedIds = new Set();
    let allPhotos = [];
    let activeYear = ['2026', '2027'].includes(String(new Date().getFullYear())) ? String(new Date().getFullYear()) : '2026';
    let batchMode = false, visibleLimit = 72, uploadBusy = false, deleteBusy = false;
    let pendingDeleteIds = [], previousFocus = null, toastTimer = null;
    let editPhotoId = null, editBusy = false, editFocus = null;

    function openEdit(photo) {
      if (editBusy || photo.deletedAt) return;
      editFocus = document.activeElement;
      editPhotoId = String(photo.id);
      $('#edit-preview').src = photo.thumbnailSrc || photo.src;
      $('#edit-preview').alt = photo.title || '当前照片';
      $('#edit-title').value = photo.title || '';
      $('#edit-date').value = photo.shotDate || '';
      $('#edit-uploaded').value = photo.uploaded ? new Date(photo.uploaded).toLocaleString('zh-CN') : '历史照片未记录上传时间';
      $('#edit-error').hidden = true;
      $('#edit-modal').hidden = false;
      document.body.classList.add('modal-open');
      $('#edit-title').focus();
    }
    function closeEdit() {
      if (editBusy) return;
      $('#edit-modal').hidden = true;
      document.body.classList.remove('modal-open');
      editPhotoId = null;
      if (editFocus?.isConnected) editFocus.focus();
    }
    $('#edit-form').addEventListener('submit', async event => {
      event.preventDefault();
      if (editBusy || !editPhotoId) return;
      const title = $('#edit-title').value.trim(), shotDate = $('#edit-date').value || null;
      if (!title || Array.from(title).length > 60) {
        $('#edit-error').textContent = '照片名称需为 1–60 个字符';
        $('#edit-error').hidden = false; return;
      }
      editBusy = true;
      $('#save-edit').textContent = '保存中…';
      for (const id of ['save-edit', 'cancel-edit', 'edit-title', 'edit-date']) $('#' + id).disabled = true;
      try {
        const data = await api('/api/manage/photos/' + encodeURIComponent(editPhotoId), {
          method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({title, shotDate})
        });
        const photo = allPhotos.find(item => String(item.id) === editPhotoId);
        if (photo) Object.assign(photo, data.photo);
        try { localStorage.setItem('photoRingMetadataUpdated', String(Date.now())); } catch {}
        editBusy = false; closeEdit(); renderGrid(); showToast('照片信息已更新');
      } catch (error) {
        $('#edit-error').textContent = error.message;
        $('#edit-error').hidden = false;
      } finally {
        editBusy = false;
        for (const id of ['save-edit', 'cancel-edit', 'edit-title', 'edit-date']) $('#' + id).disabled = false;
        $('#save-edit').textContent = '保存修改';
      }
    });
    $('#cancel-edit').addEventListener('click', closeEdit);
    $('#edit-backdrop').addEventListener('click', closeEdit);
    $('#edit-modal').addEventListener('keydown', event => {
      if (event.key === 'Escape') { event.stopPropagation(); closeEdit(); }
      if (event.key === 'Tab') {
        const controls = [...$('#edit-form').querySelectorAll('input:not([disabled]), button:not([disabled])')];
        const first = controls[0], last = controls.at(-1);
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
    });

    async function api(url, options = {}) {
      const response = await fetch(url, options);
      let data = {};
      try { data = await response.json(); } catch {}
      if (!response.ok) {
        const error = new Error(data.error || '操作失败，请稍后重试');
        error.status = response.status;
        throw error;
      }
      return data;
    }
    function showToast(text, error = false) {
      const toast = $('#toast');
      clearTimeout(toastTimer);
      toast.textContent = text;
      toast.classList.toggle('error', error);
      toast.hidden = false;
      toastTimer = setTimeout(() => { toast.hidden = true; }, 3600);
    }
    function setStatus(text, error = false) {
      const status = $('#status');
      status.textContent = text;
      status.classList.toggle('error', error);
    }
    function fileKey(file) {
      return [file.name, file.size, file.lastModified].join('|');
    }
    function renderSelection() {
      const count = selectedFiles.size;
      $('#selection').hidden = count === 0;
      $('#selection-count').textContent = '已选择 ' + count + ' 张照片';
      $('#publish').textContent = count ? '发布 ' + count + ' 张照片' : '发布照片';
      $('#publish').disabled = !count || uploadBusy;
      const fragment = document.createDocumentFragment();
      for (const [key, item] of selectedFiles) {
        const preview = document.createElement('div');
        preview.className = 'preview';
        const visual = document.createElement('div');
        visual.className = 'preview-image';
        const image = document.createElement('img');
        image.src = item.url;
        image.alt = item.file.name;
        image.onerror = () => { image.remove(); visual.textContent = '照片'; };
        visual.append(image);
        const name = document.createElement('span');
        name.className = 'preview-name';
        name.textContent = item.file.name;
        name.title = item.file.name;
        const remove = document.createElement('button');
        remove.className = 'preview-remove';
        remove.type = 'button';
        remove.textContent = '×';
        remove.setAttribute('aria-label', '移除 ' + item.file.name);
        remove.disabled = uploadBusy;
        remove.addEventListener('click', () => {
          URL.revokeObjectURL(item.url);
          selectedFiles.delete(key);
          renderSelection();
        });
        preview.append(visual, name, remove);
        fragment.append(preview);
      }
      $('#preview-grid').replaceChildren(fragment);
    }
    function addFiles(files) {
      if (uploadBusy) return;
      let invalid = 0;
      for (const file of files) {
        if (!file.type.startsWith('image/') && !/\.(heic|heif)$/i.test(file.name)) { invalid++; continue; }
        const key = fileKey(file);
        if (!selectedFiles.has(key)) selectedFiles.set(key, { file, url: URL.createObjectURL(file) });
      }
      $('#photos').value = '';
      renderSelection();
      if (invalid) showToast('有 ' + invalid + ' 个文件不是支持的照片格式', true);
    }
    function clearFiles() {
      for (const item of selectedFiles.values()) URL.revokeObjectURL(item.url);
      selectedFiles.clear();
      $('#photos').value = '';
      renderSelection();
    }
    function uploadPhotos(body, onProgress) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/manage/upload');
        xhr.upload.onprogress = event => {
          if (event.lengthComputable) onProgress(Math.round(event.loaded / event.total * 100));
        };
        xhr.onload = () => {
          let data = {};
          try { data = JSON.parse(xhr.responseText); } catch {}
          if (xhr.status >= 200 && xhr.status < 300) resolve(data);
          else {
            const error = new Error(data.error || (xhr.status === 413 ? '照片总大小超过服务器限制' : '上传失败，请稍后重试'));
            error.status = xhr.status;
            reject(error);
          }
        };
        xhr.onerror = () => reject(new Error('网络连接失败，请稍后重试'));
        xhr.send(body);
      });
    }
    async function load() {
      try {
        const data = await api('/api/manage/photos');
        allPhotos = Array.isArray(data.photos) ? data.photos : [];
        login.hidden = true;
        panel.hidden = false;
        renderGrid();
        try {
          const status = await api('/api/manage/oss/status');
          $('#oss-test-option').hidden = !(status.configured && status.testUploadEnabled && status.uploadMode === 'local');
        } catch { $('#oss-test-option').hidden = true; }
      } catch (error) {
        if (error.status === 401) {
          login.hidden = false;
          panel.hidden = true;
        } else {
          showToast(error.message, true);
        }
      }
    }
    function filteredPhotos() {
      const query = $('#search').value.trim().toLocaleLowerCase();
      return allPhotos.filter(photo => (activeYear === 'all' || String(photo.year) === activeYear)
        && (!query || String(photo.title || '').toLocaleLowerCase().includes(query)));
    }
    function closeMenus() {
      grid.querySelectorAll('.photo.menu-open').forEach(card => {
        card.classList.remove('menu-open');
        card.querySelector('.photo-menu').hidden = true;
        card.querySelector('.photo-action').setAttribute('aria-expanded', 'false');
      });
    }
    function renderGrid() {
      const photos = filteredPhotos();
      $('#photo-count').textContent = '共 ' + photos.length + ' 张';
      document.querySelectorAll('.year-filters button').forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.year === activeYear));
      });
      $('#library').classList.toggle('is-batch', batchMode);
      $('#batch-toggle').textContent = batchMode ? '完成' : '批量管理';
      $('#batch-actions').hidden = !batchMode;
      updateBatchActions();
      $('#empty-state').hidden = photos.length > 0;
      $('#empty-state').textContent = allPhotos.length ? '这里暂时没有符合条件的照片。' : '还没有照片，先发布一些回忆吧。';
      const fragment = document.createDocumentFragment();
      for (const photo of photos.slice(0, visibleLimit)) {
        const card = document.createElement('article');
        card.className = 'photo';
        card.dataset.id = String(photo.id);
        card.classList.toggle('is-selected', selectedIds.has(String(photo.id)));
        const media = document.createElement('div');
        media.className = 'photo-media';
        const image = document.createElement('img');
        image.src = photo.thumbnailSrc || photo.src;
        image.alt = photo.title || '照片';
        image.loading = 'lazy';
        media.append(image);
        const select = document.createElement('button');
        select.className = 'photo-select';
        select.type = 'button';
        select.setAttribute('role', 'checkbox');
        select.setAttribute('aria-label', '选择 ' + (photo.title || '照片'));
        select.setAttribute('aria-checked', String(selectedIds.has(String(photo.id))));
        select.textContent = selectedIds.has(String(photo.id)) ? '✓' : '';
        select.addEventListener('click', () => toggleSelection(photo.id, card));
        const action = document.createElement('button');
        action.className = 'photo-action';
        action.type = 'button';
        action.textContent = '···';
        action.setAttribute('aria-label', '管理 ' + (photo.title || '照片'));
        action.setAttribute('aria-haspopup', 'menu');
        action.setAttribute('aria-expanded', 'false');
        const menu = document.createElement('div');
        menu.className = 'photo-menu';
        menu.setAttribute('role', 'menu');
        menu.hidden = true;
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.setAttribute('role', 'menuitem');
        remove.textContent = '移到回收站';
        remove.addEventListener('click', () => { closeMenus(); openDelete([String(photo.id)]); });
        menu.append(remove);
        action.addEventListener('click', event => {
          event.stopPropagation();
          const wasOpen = !menu.hidden;
          closeMenus();
          if (!wasOpen) {
            card.classList.add('menu-open');
            menu.hidden = false;
            action.setAttribute('aria-expanded', 'true');
          }
        });
        media.append(select, action, menu);
        const info = document.createElement('div');
        info.className = 'photo-info';
        const title = document.createElement('strong');
        title.textContent = photo.title || '未命名照片';
        const detail = document.createElement('small');
        const date = typeof photo.uploaded === 'string' ? photo.uploaded.slice(0, 10).replaceAll('-', '.') : '';
        detail.textContent = String(photo.year) + (date ? ' · ' + date : '');
        info.append(title, detail);
        const edit = document.createElement('button');
        edit.type = 'button'; edit.className = 'edit-info'; edit.textContent = '编辑信息';
        edit.addEventListener('click', () => openEdit(photo));
        if (photo.shotDate) detail.textContent += ' · 拍摄 ' + photo.shotDate;
        info.append(edit);
        card.append(media, info);
        card.addEventListener('click', event => {
          if (batchMode && !event.target.closest('button')) toggleSelection(photo.id, card);
        });
        fragment.append(card);
      }
      grid.replaceChildren(fragment);
      $('#load-more').hidden = photos.length <= visibleLimit;
    }
    function toggleSelection(id, card) {
      const key = String(id);
      if (selectedIds.has(key)) selectedIds.delete(key); else selectedIds.add(key);
      const selected = selectedIds.has(key);
      card.classList.toggle('is-selected', selected);
      const select = card.querySelector('.photo-select');
      select.setAttribute('aria-checked', String(selected));
      select.textContent = selected ? '✓' : '';
      updateBatchActions();
    }
    function updateBatchActions() {
      const count = selectedIds.size;
      $('#selected-count').textContent = '已选择 ' + count + ' 张';
      $('#batch-delete').textContent = '移到回收站 ' + count + ' 张';
      $('#batch-delete').disabled = !count || deleteBusy;
    }
    function openDelete(ids) {
      if (!ids.length || deleteBusy) return;
      pendingDeleteIds = ids;
      previousFocus = document.activeElement.closest('.photo-menu')
        ? document.activeElement.closest('.photo').querySelector('.photo-action')
        : document.activeElement;
      $('#delete-message').textContent = ids.length === 1
        ? '照片可以从回收站恢复，原图和相关留言暂时不会删除。'
        : '选中的 ' + ids.length + ' 张照片可以从回收站恢复，原图和相关留言暂时不会删除。';
      $('#confirm-delete').textContent = ids.length === 1 ? '移到回收站' : '移到回收站 ' + ids.length + ' 张';
      $('#delete-modal').hidden = false;
      document.body.classList.add('modal-open');
      $('#cancel-delete').focus();
    }
    function closeDelete() {
      if (deleteBusy) return;
      $('#delete-modal').hidden = true;
      document.body.classList.remove('modal-open');
      pendingDeleteIds = [];
      if (previousFocus && previousFocus.isConnected) previousFocus.focus();
    }
    async function confirmDelete() {
      if (deleteBusy || !pendingDeleteIds.length) return;
      deleteBusy = true;
      const ids = [...pendingDeleteIds];
      const confirm = $('#confirm-delete');
      confirm.disabled = true;
      $('#cancel-delete').disabled = true;
      confirm.textContent = '正在移入...';
      let deleted = 0, failure = null;
      for (const id of ids) {
        try {
          await api('/api/manage/photos/' + encodeURIComponent(id), { method: 'DELETE' });
          deleted++;
          selectedIds.delete(id);
          allPhotos = allPhotos.filter(photo => String(photo.id) !== id);
        } catch (error) {
          failure = error;
          break;
        }
      }
      deleteBusy = false;
      confirm.disabled = false;
      $('#cancel-delete').disabled = false;
      closeDelete();
      renderGrid();
      if (deleted) showToast(deleted + ' 张照片已移到回收站，公开页面刷新后同步');
      if (failure) showToast(deleted ? '部分照片未能移入回收站：' + failure.message : failure.message, true);
    }

    $('#login-button').addEventListener('click', async () => {
      const button = $('#login-button');
      button.disabled = true;
      $('#login-status').textContent = '';
      try {
        await api('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('#password').value }) });
        $('#password').value = '';
        await load();
      } catch (error) {
        $('#login-status').textContent = error.message;
      } finally { button.disabled = false; }
    });
    $('#password').addEventListener('keydown', event => { if (event.key === 'Enter') $('#login-button').click(); });
    $('#logout').addEventListener('click', async () => {
      try {
        await api('/api/logout', { method: 'POST' });
        clearFiles();
        selectedIds.clear();
        allPhotos = [];
        panel.hidden = true;
        login.hidden = false;
      } catch (error) { showToast(error.message, true); }
    });
    $('#dropzone').addEventListener('click', () => { if (!uploadBusy) $('#photos').click(); });
    $('#dropzone').addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        if (!uploadBusy) $('#photos').click();
      }
    });
    $('#photos').addEventListener('change', event => addFiles(event.target.files));
    ['dragenter', 'dragover'].forEach(name => $('#dropzone').addEventListener(name, event => {
      event.preventDefault();
      if (!uploadBusy) $('#dropzone').classList.add('is-over');
    }));
    ['dragleave', 'drop'].forEach(name => $('#dropzone').addEventListener(name, event => {
      event.preventDefault();
      $('#dropzone').classList.remove('is-over');
    }));
    $('#dropzone').addEventListener('drop', event => addFiles(event.dataTransfer.files));
    $('#upload').addEventListener('submit', async event => {
      event.preventDefault();
      if (uploadBusy || !selectedFiles.size) return;
      const files = [...selectedFiles.entries()], count = files.length, year = $('#year').value;
      uploadBusy = true;
      renderSelection();
      $('#publish').textContent = '正在上传...';
      let succeeded = 0;
      const failed = [];
      try {
        for (let index = 0; index < files.length; index++) {
          const [key, item] = files[index];
          const body = new FormData();
          body.append('year', year);
          body.append('photos', item.file);
          if ($('#oss-test').checked && !$('#oss-test-option').hidden) body.append('storage', 'oss-test');
          setStatus(`正在上传 ${index + 1} / ${count}`);
          try {
            await uploadPhotos(body, () => {});
            succeeded++;
            URL.revokeObjectURL(item.url);
            selectedFiles.delete(key);
          } catch (error) {
            failed.push(`${item.file.name}：${error.message}`);
          }
        }
        activeYear = year;
        selectedIds.clear();
        batchMode = false;
        visibleLimit = 72;
        await load();
        setStatus(failed.length ? `${succeeded} 张成功，${failed.length} 张失败：${failed.join('；')}` : '');
        if (succeeded) showToast(succeeded + ' 张照片上传成功');
        if (failed.length) showToast(`${failed.length} 张失败：${failed.slice(0, 2).join('；')}`, true);
      } catch (error) {
        setStatus(error.message, true);
        showToast(error.message, true);
      } finally {
        uploadBusy = false;
        renderSelection();
      }
    });
    document.querySelectorAll('.year-filters button').forEach(button => button.addEventListener('click', () => {
      activeYear = button.dataset.year;
      visibleLimit = 72;
      selectedIds.clear();
      renderGrid();
    }));
    $('#search').addEventListener('input', () => { visibleLimit = 72; selectedIds.clear(); renderGrid(); });
    $('#batch-toggle').addEventListener('click', () => {
      batchMode = !batchMode;
      selectedIds.clear();
      closeMenus();
      renderGrid();
    });
    $('#clear-selection').addEventListener('click', () => { selectedIds.clear(); renderGrid(); });
    $('#batch-delete').addEventListener('click', () => openDelete([...selectedIds]));
    $('#load-more').addEventListener('click', () => { visibleLimit += 72; renderGrid(); });
    $('#cancel-delete').addEventListener('click', closeDelete);
    $('#modal-backdrop').addEventListener('click', closeDelete);
    $('#confirm-delete').addEventListener('click', confirmDelete);
    document.addEventListener('click', event => { if (!event.target.closest('.photo-action, .photo-menu')) closeMenus(); });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        if (!$('#delete-modal').hidden) closeDelete(); else closeMenus();
      } else if (event.key === 'Tab' && !$('#delete-modal').hidden) {
        const first = $('#cancel-delete'), last = $('#confirm-delete');
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
    });
    load();
  </script>
</body>
</html>
