<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>凡凡and涵涵 · 回收站</title>
<style>
:root{--paper:#f4f1eb;--surface:#fffcf8;--wine:#99515d;--deep:#7d3d49;--line:#e5dcd3;--muted:#817a73;color:#38332f;background:var(--paper);font-family:"PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}body.modal-open{overflow:hidden}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}button,a,input,select{transition:background .2s,border-color .2s}:is(button,a,input,select):focus-visible{outline:2px solid var(--wine);outline-offset:3px}.shell{width:min(1240px,calc(100% - 40px));margin:auto;padding:26px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:25px}h1,h2{margin:0;font:400 28px Georgia,"Songti SC",serif}.brand p,.muted{font-size:12px;color:var(--muted);line-height:1.7}.top-actions{display:flex;gap:4px;flex-wrap:wrap;align-items:center}.top-actions a,.top-actions button{border:0;background:transparent;padding:11px 12px;border-radius:999px;font-size:12px;text-decoration:none;color:#70665f}.top-actions a[aria-current=page]{background:#e9e3dc}.top-actions a:hover{background:#fff}.surface{padding:25px;background:var(--surface);border:1px solid #5c4c4115;border-radius:20px;box-shadow:0 10px 32px #3b2f270b}.login{width:min(430px,100%);margin:12vh auto}.login input{width:100%;margin:14px 0}.primary,.quiet,.danger{min-height:39px;padding:8px 15px;border:1px solid var(--line);border-radius:10px;font-size:12px;background:#fff;color:#625b55}.primary{background:var(--wine);color:#fff;border-color:var(--wine)}.primary:hover{background:var(--deep)}.danger{color:#973e44;border-color:#ddbbba;background:#fff8f5}.danger:hover{background:#f8e9e6}.heading{display:flex;align-items:baseline;gap:12px}.filters{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}input,select{min-height:42px;padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:#fffdfa;color:inherit}.filters input{flex:1;min-width:170px}.trash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:17px}.trash-card{min-width:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fffdfa}.trash-image{position:relative;overflow:hidden;aspect-ratio:4/3;background:#eee7df;display:grid;place-items:center;color:var(--muted);font-size:12px}.trash-image img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.info{padding:15px}.info h3{margin:0 0 8px;font-size:14px;font-weight:500}.info p{margin:5px 0;overflow-wrap:anywhere;font-size:11px;color:var(--muted);line-height:1.65}.card-actions{display:flex;gap:8px;margin-top:13px}.empty{text-align:center;padding:55px 10px;color:var(--muted);font-size:13px}.paging{display:flex;justify-content:center;gap:13px;align-items:center;margin-top:23px;font-size:12px;color:var(--muted)}.modal{position:fixed;inset:0;z-index:50;background:#30262366;display:grid;place-items:center;padding:20px}.dialog{background:var(--surface);padding:27px;border-radius:18px;width:min(420px,100%);box-shadow:0 24px 60px #241c1b2d}.dialog h2{font-size:23px}.dialog p{font-size:13px;color:#746b64;line-height:1.8}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.toast{position:fixed;right:20px;bottom:20px;z-index:70;max-width:calc(100% - 40px);padding:12px 17px;border-radius:11px;background:#524842;color:#fff;font-size:12px;line-height:1.7}.toast.error{background:var(--deep)}@media(max-width:560px){.shell{width:calc(100% - 28px);padding-top:18px}.surface{padding:16px}.trash-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.info{padding:10px}.card-actions{flex-direction:column}.top-actions{width:100%}.dialog{padding:23px}.trash-image{aspect-ratio:1}.toast{left:15px;right:15px;bottom:max(15px,env(safe-area-inset-bottom))}}@media(max-width:420px){.trash-grid{grid-template-columns:minmax(0,1fr)}.card-actions{flex-direction:row;flex-wrap:wrap}.trash-image{aspect-ratio:4/3}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><main class="shell">
<section class="surface login" id="login"><h1>回收站</h1><p class="muted">使用与照片管理相同的密码登录。</p><input id="password" type="password" placeholder="管理密码" autocomplete="current-password" aria-label="管理密码"><button class="primary" id="login-button">登录</button><p class="muted" id="login-status" role="status"></p></section>
<section id="panel" hidden>
<header class="top"><div class="brand"><h1>凡凡and涵涵</h1><p>回收站</p></div><nav class="top-actions" aria-label="后台导航"><a href="/manage">照片管理</a><a href="/admin/book">书本排版</a><a href="/admin/music">音乐管理</a><a href="/admin/comments">评论管理</a><a href="/admin/trash" aria-current="page">回收站</a><a href="/" target="_blank" rel="noopener">查看网站 ↗</a><button id="logout">退出</button></nav></header>
<div class="surface"><div class="heading"><h2>回收站</h2><span class="muted" id="total"></span></div><p class="muted">暂时收起的回忆，会一直留在这里。你可以恢复，也可以手动永久删除。</p><div class="filters"><input id="search" type="search" placeholder="搜索照片名称" aria-label="搜索照片"><select id="year" aria-label="照片年份"><option value="">全部年份</option><option>2026</option><option>2027</option></select><button class="quiet" id="refresh">刷新</button></div><div class="trash-grid" id="photos"></div><p class="empty" id="empty" hidden>回收站里暂时没有照片。</p><div class="paging" id="paging" hidden><button class="quiet" id="prev">上一页</button><span id="page-label"></span><button class="quiet" id="next">下一页</button></div></div>
</section></main>
<div class="modal" id="purge-modal" role="dialog" aria-modal="true" aria-labelledby="purge-title" hidden><div class="dialog"><h2 id="purge-title">永久删除这张照片？</h2><p id="purge-name"></p><p>永久删除后，这张照片的原图、缩略图及相关留言将无法通过回收站恢复。书本中的照片位置会留空，关联精选留言会被移除。</p><div class="modal-actions"><button class="quiet" id="cancel-purge">取消</button><button class="danger" id="confirm-purge">永久删除</button></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s);let photos=[],page=1,purgeId=null,busy=false,timer=0,focusBefore=null;
async function api(url,options={}){const response=await fetch(url,{cache:'no-store',...options});let data={};try{data=await response.json()}catch{}if(!response.ok){const error=new Error(data.error||'操作失败，请稍后重试');error.status=response.status;throw error}return data}
function toast(text,error=false){clearTimeout(timer);$('#toast').textContent=text;$('#toast').classList.toggle('error',error);$('#toast').hidden=false;timer=setTimeout(()=>$('#toast').hidden=true,5000)}
function render(){const query=$('#search').value.trim().toLocaleLowerCase(),year=$('#year').value;const filtered=photos.filter(p=>(!year||p.year===year)&&(!query||(p.title||'').toLocaleLowerCase().includes(query)||p.id.toLocaleLowerCase().includes(query)));page=Math.min(page,Math.max(1,Math.ceil(filtered.length/24)));$('#total').textContent='共 '+photos.length+' 张';$('#empty').hidden=filtered.length>0;$('#empty').textContent=photos.length?'没有符合条件的照片。':'回收站里暂时没有照片。';$('#paging').hidden=filtered.length<=24;$('#prev').disabled=page<=1;$('#next').disabled=page*24>=filtered.length;$('#page-label').textContent=page+' / '+Math.max(1,Math.ceil(filtered.length/24));const root=$('#photos');root.replaceChildren();for(const photo of filtered.slice((page-1)*24,page*24)){const card=document.createElement('article');card.className='trash-card';const visual=document.createElement('div');visual.className='trash-image';const img=document.createElement('img');img.src=photo.thumbnailSrc||photo.src;img.alt=photo.title||'照片';img.loading='lazy';img.onerror=()=>{img.remove();visual.textContent='资源暂不可用'};visual.append(img);const info=document.createElement('div');info.className='info';const title=document.createElement('h3');title.textContent=photo.title||'照片';info.append(title);for(const text of [photo.year+' · '+new Date(photo.deletedAt).toLocaleString(),photo.commentTotal+' 条留言 · '+(photo.bookReferenced?'书本仍有引用':'暂无书本照片引用'),...(photo.purgeStartedAt?['永久清理未完成，请重试；此照片暂不能恢复。']:[])]){const line=document.createElement('p');line.textContent=text;info.append(line)}const actions=document.createElement('div');actions.className='card-actions';const restore=document.createElement('button');restore.className='primary';restore.textContent='恢复';restore.disabled=busy||!!photo.purgeStartedAt;restore.title=photo.purgeStartedAt?'部分资源可能已删除，请重试永久删除':'';restore.addEventListener('click',()=>void restorePhoto(photo.id));const purge=document.createElement('button');purge.className='danger';purge.textContent=photo.purgeStartedAt?'重试永久删除':'永久删除';purge.disabled=busy;purge.addEventListener('click',()=>{purgeId=photo.id;focusBefore=purge;$('#purge-name').textContent=photo.title||'照片';$('#purge-modal').hidden=false;document.body.classList.add('modal-open');$('#cancel-purge').focus()});actions.append(restore,purge);info.append(actions);card.append(visual,info);root.append(card)}}
async function load(){try{const data=await api('/api/manage/trash/photos');photos=data.photos||[];$('#login').hidden=true;$('#panel').hidden=false;render()}catch(error){if(error.status===401){$('#login').hidden=false;$('#panel').hidden=true}else toast(error.message,true)}}
async function restorePhoto(id){if(busy)return;busy=true;render();try{await api('/api/manage/photos/'+encodeURIComponent(id)+'/restore',{method:'POST'});await load();toast('照片已恢复')}catch(error){toast(error.message,true)}finally{busy=false;render()}}
function closeModal(){if(busy)return;$('#purge-modal').hidden=true;document.body.classList.remove('modal-open');purgeId=null;if(focusBefore?.isConnected)focusBefore.focus()}
$('#confirm-purge').addEventListener('click',async()=>{if(busy||!purgeId)return;const id=purgeId;busy=true;$('#confirm-purge').disabled=true;$('#cancel-purge').disabled=true;$('#confirm-purge').textContent='正在清理…';try{await api('/api/manage/trash/photos/'+encodeURIComponent(id),{method:'DELETE'});toast('照片已永久删除')}catch(error){toast(error.message,true)}finally{busy=false;$('#confirm-purge').disabled=false;$('#cancel-purge').disabled=false;$('#confirm-purge').textContent='永久删除';closeModal();await load()}});
$('#cancel-purge').addEventListener('click',closeModal);$('#purge-modal').addEventListener('click',e=>{if(e.target.id==='purge-modal')closeModal()});document.addEventListener('keydown',e=>{if($('#purge-modal').hidden)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const first=$('#cancel-purge'),last=$('#confirm-purge');if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
$('#login-button').addEventListener('click',async()=>{$('#login-button').disabled=true;try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#password').value})});$('#password').value='';$('#login-status').textContent='';await load()}catch(error){$('#login-status').textContent=error.message}finally{$('#login-button').disabled=false}});$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')$('#login-button').click()});$('#logout').addEventListener('click',async()=>{await api('/api/logout',{method:'POST'});$('#panel').hidden=true;$('#login').hidden=false});$('#search').addEventListener('input',()=>{page=1;render()});$('#year').addEventListener('change',()=>{page=1;render()});$('#refresh').addEventListener('click',()=>void load());$('#prev').addEventListener('click',()=>{page--;render()});$('#next').addEventListener('click',()=>{page++;render()});void load();})();
</script></body></html>
